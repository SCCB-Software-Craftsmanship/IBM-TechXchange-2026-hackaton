name: Testability Run Tracker

on:
  # Trigger automatically when testability-prep opens its child PR
  pull_request:
    types: [opened]
    branches:
      - '**'  # any base branch — we filter on head ref name below

  # Manual dispatch: run for any PR (no child PR needed) or to re-save a run
  workflow_dispatch:
    inputs:
      pr_link:
        description: 'URL of the original approved PR'
        required: true
        type: string
      testability_pr_link:
        description: 'URL of the child testability PR (leave blank if none was opened)'
        required: false
        type: string
        default: ''
      barriers_resolved:
        description: 'Comma-separated barrier IDs resolved (e.g. B2,B3) or leave blank'
        required: false
        type: string
        default: ''
      summary:
        description: 'Prose summary from testability-prep Step 11'
        required: false
        type: string
        default: ''

jobs:
  save-testability-run:
    name: Save TestabilityRun to Cloudant
    runs-on: ubuntu-latest

    # For the pull_request trigger: only run when the head branch is a testability/* branch
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.head_ref, 'testability/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # -----------------------------------------------------------------------
      # Resolve inputs — pull_request event vs workflow_dispatch
      # -----------------------------------------------------------------------
      - name: Resolve run inputs
        id: inputs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # For pull_request events, reconstruct the values from PR metadata
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HTML_URL: ${{ github.event.pull_request.html_url }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          # For workflow_dispatch, pass through the inputs directly
          INPUT_PR_LINK: ${{ inputs.pr_link }}
          INPUT_TESTABILITY_PR_LINK: ${{ inputs.testability_pr_link }}
          INPUT_BARRIERS: ${{ inputs.barriers_resolved }}
          INPUT_SUMMARY: ${{ inputs.summary }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Extract original PR link from the child PR body
            # testability-prep embeds "Original PR: #N <url>" in its PR body
            ORIGINAL_PR=$(echo "$PR_BODY" | grep -oP 'https://github\.com[^\s)]+/pull/[0-9]+' | head -1)
            if [ -z "$ORIGINAL_PR" ]; then
              # Fall back to the base branch — find the PR whose head = base of this PR
              ORIGINAL_PR=$(gh pr list --base "$PR_BASE_REF" --state open --json url --jq '.[0].url' 2>/dev/null || echo "")
            fi
            if [ -z "$ORIGINAL_PR" ]; then
              ORIGINAL_PR="unknown — see child PR $PR_HTML_URL"
            fi

            # Extract barriers from PR title (e.g. "testability(#12): fix B2, B3")
            BARRIERS=$(echo "${{ github.event.pull_request.title }}" | grep -oP 'B[0-9]+' | tr '\n' ',' | sed 's/,$//')

            echo "pr_link=$ORIGINAL_PR"                   >> "$GITHUB_OUTPUT"
            echo "testability_pr_link=$PR_HTML_URL"       >> "$GITHUB_OUTPUT"
            echo "barriers=${BARRIERS:-none}"             >> "$GITHUB_OUTPUT"
            echo "summary=${{ github.event.pull_request.title }}" >> "$GITHUB_OUTPUT"
          else
            echo "pr_link=$INPUT_PR_LINK"                 >> "$GITHUB_OUTPUT"
            echo "testability_pr_link=$INPUT_TESTABILITY_PR_LINK" >> "$GITHUB_OUTPUT"
            echo "barriers=$INPUT_BARRIERS"               >> "$GITHUB_OUTPUT"
            echo "summary=$INPUT_SUMMARY"                 >> "$GITHUB_OUTPUT"
          fi

      # -----------------------------------------------------------------------
      # Bootstrap DB (idempotent — safe to run every time)
      # -----------------------------------------------------------------------
      - name: Bootstrap Cloudant database
        env:
          CLOUDANT_URL: ${{ secrets.CLOUDANT_URL }}
          CLOUDANT_API_KEY: ${{ secrets.CLOUDANT_API_KEY }}
        run: node scripts/cloudant/bootstrap.js

      # -----------------------------------------------------------------------
      # Save the TestabilityRun record
      # -----------------------------------------------------------------------
      - name: Save TestabilityRun record
        id: save
        env:
          CLOUDANT_URL: ${{ secrets.CLOUDANT_URL }}
          CLOUDANT_API_KEY: ${{ secrets.CLOUDANT_API_KEY }}
        run: |
          RESULT=$(node scripts/cloudant/save.js create \
            --pr-link "${{ steps.inputs.outputs.pr_link }}" \
            --testability-pr-link "${{ steps.inputs.outputs.testability_pr_link }}" \
            --barriers "${{ steps.inputs.outputs.barriers }}" \
            --summary "${{ steps.inputs.outputs.summary }}")
          echo "$RESULT"
          DOC_ID=$(echo "$RESULT" | node -e "process.stdin.resume();let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).id))")
          echo "doc_id=$DOC_ID" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          echo "### ✅ TestabilityRun saved to Cloudant" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Document ID | \`${{ steps.save.outputs.doc_id }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Initial state | \`tests_not_yet_implemented\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| PR link | ${{ steps.inputs.outputs.pr_link }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Testability PR | ${{ steps.inputs.outputs.testability_pr_link }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Barriers | ${{ steps.inputs.outputs.barriers }} |" >> "$GITHUB_STEP_SUMMARY"
